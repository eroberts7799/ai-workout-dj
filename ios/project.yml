name: AwdjPlayer
options:
  bundleIdPrefix: com.ethanroberts
  deploymentTarget:
    iOS: "17.0"
targets:
  AwdjPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI Workout DJ
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanroberts.awdjplayer
        DEVELOPMENT_TEAM: 6N9T4GRA6U
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AwdjPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AwdjPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanroberts.awdjplayer.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
