name: AwdjPlayer
options:
  bundleIdPrefix: com.ethanroberts
  deploymentTarget:
    iOS: "17.0"
targets:
  AwdjPlayer:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI Workout DJ
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanroberts.awdjplayer
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
