<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workout DJ — Latency Spike</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #root { max-width: 900px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 18px; } h2 { font-size: 15px; margin-top: 28px; }
      button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; margin-right: 8px; }
      button:disabled { background: #30363d; cursor: default; }
      input, select { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 7px 10px; font: inherit; width: 100%; box-sizing: border-box; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      td, th { border: 1px solid #30363d; padding: 4px 8px; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      .ok { color: #3fb950; } .warn { color: #d29922; } .bad { color: #f85149; }
      .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 16px; }
      .muted { color: #8b949e; }
      .verdict { font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
