name: AwdjPlayer
options:
  bundleIdPrefix: com.ethanroberts
  deploymentTarget:
    iOS: "17.0"
targets:
  AwdjPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI Workout DJ
        UILaunchScreen: {}
        # 'location' keeps trail mode's GPS alive with the screen off;
        # 'bluetooth-central' keeps the watch's HR broadcast flowing there too.
        UIBackgroundModes: [audio, location, bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSLocationWhenInUseUsageDescription: Trail mode conducts your music from your position and elevation — the drop hits as you crest the hill, no signal needed.
        NSMotionUsageDescription: The barometer detects climbs and crests so the music can reward them.
        NSBluetoothAlwaysUsageDescription: Your watch can broadcast heart rate over Bluetooth — the music rewards real effort, even with no signal on the trail.
        CFBundleURLTypes:
          - CFBundleURLName: spotify-auth
            CFBundleURLSchemes: [awdj]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanroberts.awdjplayer
        DEVELOPMENT_TEAM: 6N9T4GRA6U
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "32"
        GENERATE_INFOPLIST_FILE: NO
  AwdjPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Tests/parity-fixture.json
        buildPhase: resources
    dependencies:
      - target: AwdjPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanroberts.awdjplayer.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
